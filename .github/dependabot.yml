# Every package is pinned exactly (R4), so these PRs are how security fixes arrive (R5).
# A PR is merged only with CI green: CI checks the lock against its .in file and audits it.
version: 2
updates:
  # pip-compile locks: Dependabot edits the .in pin and recompiles with the options in the
  # lock's header
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # ESLint 10 is its own upgrade, not part of Next 16's (R8); eslint-config-next 16.4 accepts it
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
