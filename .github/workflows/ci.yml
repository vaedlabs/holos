name: CI

# Pushes run only on main: a PR branch is tested by its pull_request run, so Dependabot's
# branches don't run twice (R5)
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on a PR cancels the run still going for the old one (Dependabot rebases
# every open PR after each merge). A push to main gets a group of its own commit: GitHub
# keeps one pending run per group, so a shared main group dropped a merge's run (R5)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: holos
          POSTGRES_PASSWORD: holos
          POSTGRES_DB: holos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Separate databases: integration tests refuse to run against DATABASE_URL
      DATABASE_URL: postgresql+psycopg://holos:holos@localhost:5432/postgres
      # The integration tests (about half the suite) need TEST_DATABASE_URL: without it
      # the run stops with "integration tests need TEST_DATABASE_URL" (R3), never a green
      # run that skipped them. To fix that failure: put this line back, pointing at the
      # postgres service above, and keep its name the same as in backend/.env.example and
      # tests/integration/conftest.py (rename all three together).
      TEST_DATABASE_URL: postgresql+psycopg://holos:holos@localhost:5432/holos_test
      # Placeholders only: push tests make no paid calls (Plan A.1 rule 8)
      OPENAI_API_KEY: sk-ci-placeholder
      TAVILY_API_KEY: ci-placeholder
      # Sessions (Plan C.6): CI-only values; Turnstile uses Cloudflare's public test key
      SESSION_SECRET: ci-session-secret-placeholder-at-least-32-bytes
      IP_SALT_SECRET: ci-ip-salt-secret-placeholder-at-least-32-bytes
      APP_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:8000
      TRUSTED_PROXY: none
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      TURNSTILE_INTERACTIVE_SECRET_KEY: 1x0000000000000000000000000000000AA
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Every package pinned with hashes, so CI runs exactly what was tested locally (R4)
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      # Compares only the lines pip reads: on Linux the "# via" notes differ from a Mac
      # compile (SQLAlchemy needs greenlet on x86_64 only), the pins and hashes do not
      - name: Lock matches its inputs
        run: |
          for f in requirements requirements-dev; do
            cp $f.txt /tmp/$f.committed
            pip-compile -q --generate-hashes --allow-unsafe --strip-extras -o $f.txt $f.in
            diff <(grep -v '^ *#' /tmp/$f.committed) <(grep -v '^ *#' $f.txt)
          done
      # A published advisory against anything that ships fails the run (R5). The lock is
      # complete and hashed, so pip-audit reads it as is instead of resolving it again
      - name: Audit the runtime lock
        run: pip-audit -r requirements.txt --require-hashes --disable-pip
      # Test tools never ship: their advisories are listed here and fixed by Dependabot's
      # weekly PRs, without blocking the run
      - name: Audit the dev lock (listed, not blocking)
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt --require-hashes --disable-pip
      - run: ruff check .
      - name: Contracts are up to date
        run: python -m app.contracts.generate --check
      - name: Migrations build an empty database
        run: alembic upgrade head
      - run: pytest -m "not paid and not load"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Only what ships to the browser fails the run (R5); dev tools are Dependabot's job
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # Colours only through theme.css roles; text contrast AA in light and dark (R7)
      - run: npm run check:theme
      - run: npm test
      # Catches files the repo needs but doesn't hold (frontend/lib/ was ignored once)
      - run: npm run build
