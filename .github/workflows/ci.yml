name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: holos
          POSTGRES_PASSWORD: holos
          POSTGRES_DB: holos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Separate databases: integration tests refuse to run against DATABASE_URL
      DATABASE_URL: postgresql+psycopg://holos:holos@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://holos:holos@localhost:5432/holos_test
      # Placeholders only: push tests make no paid calls (Plan A.1 rule 8)
      OPENAI_API_KEY: sk-ci-placeholder
      GOOGLE_GEMINI_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
      JWT_SECRET_KEY: ci-placeholder-secret-key-at-least-32-chars
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Contracts are up to date
        run: python -m app.contracts.generate --check
      - name: Migrations build an empty database
        run: alembic upgrade head
      - run: pytest -m "not paid and not load"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
