line-length = 100
target-version = "py312"

# Legacy code written before linting (Plan P0.8). New files are linted in full.
# When a phase rewrites or deletes a file, remove it from this list.
extend-exclude = [
    "alembic/env.py",
    "alembic/versions/2ee498e37982_add_nutrition_and_mental_fitness_log_.py",
    "alembic/versions/5610f35e0f8a_add_conversation_messages_table.py",
    "alembic/versions/624d559258af_add_image_path_to_conversation_messages.py",
    "alembic/versions/ae8c2903a3db_add_agent_type_to_conversation_messages.py",
    "alembic/versions/cd5e821b7af6_add_performance_indexes.py",
    "alembic/versions/e79813599dcb_add_agent_execution_logs_table.py",
    "alembic/versions/e90710938d2d_add_image_path_to_conversation_messages.py",
    "alembic/versions/f29379640c3d_add_demographics_to_user_preferences.py",
    "app/main.py",
    "app/models/__init__.py",
    "app/models/conversation_message.py",
    "app/models/medical_history.py",
    "app/models/mental_fitness_log.py",
    "app/models/nutrition_log.py",
    "app/models/user.py",
    "app/models/user_preferences.py",
    "app/models/workout_log.py",
    "app/services/medical_service.py",
    "app/services/user_service.py",
]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form",
]
