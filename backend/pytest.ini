[pytest]
# Pytest configuration file for Holos backend tests
# This file configures test discovery, execution options, and test markers

# Test Discovery Configuration
# -----------------------------
# testpaths: Directories to search for test files
# Pytest will recursively search these directories for test files
testpaths = tests

# python_files: File name patterns to identify test files
# Matches files starting with "test_" (e.g., test_auth.py, test_agents.py)
python_files = test_*.py

# python_classes: Class name patterns to identify test classes
# Matches classes starting with "Test" (e.g., TestAuth, TestAgents)
python_classes = Test*

# python_functions: Function name patterns to identify test functions
# Matches functions starting with "test_" (e.g., test_login, test_register)
python_functions = test_*

# Test Execution Options
# ----------------------
# addopts: Additional command-line options applied to all test runs
# These options can be overridden via command line if needed
# Verbose output, short tracebacks, strict markers
addopts =
    -v
    --tb=short
    # Paid and load tests only when asked for: pytest -m paid (a later -m wins)
    -m "not paid and not load"
    --strict-markers

# pytest-asyncio finds async tests and fixtures itself, so no test needs an asyncio mark (a mark on
# a sync test is a warning in 1.x)
asyncio_mode = auto
# Each async fixture gets a fresh event loop, as each test does. pytest-asyncio 1.x warns while
# this is unset because a later release changes the default.
asyncio_default_fixture_loop_scope = function

# Marker registration (required with --strict-markers)
markers =
    asyncio: async test using pytest-asyncio
    unit: needs nothing; runs on push
    integration: needs Postgres (TEST_DATABASE_URL); runs on push
    contract: uses recorded fixtures; runs on push
    load: Postgres and FakeProvider with delays; looser limit on push, strict nightly
    paid: real API keys; nightly or by hand, never on push
