  - id: data.confirm_race
    layer: data
    what: Two confirms of one entry at once, or its save fails.
    cause: none
    handling: A row lock logs it once; a failed save rolls back and the entry still waits.
    person_sees: The same answer twice; after a failure, they can confirm again.
    code: null
    tests:
      - tests/integration/test_state_store.py::test_two_concurrent_confirms_commit_once
      - tests/integration/test_writes.py::test_a_failed_commit_leaves_the_write_pending_and_confirmable
    seen_live: null

  - id: data.trace_not_written
    layer: data
    what: Writing a request's trace fails.
