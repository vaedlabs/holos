  # --- Data ---

  - id: data.down_at_flood_check
    layer: data
    what: The database is down or unreachable at the flood check.
    cause: none
    handling: Let through after at most 0.5 s, then skipped for 5 s; the crisis stream needs no database.
    person_sees: Depends on the next step.
    code: null
    tests:
      - tests/integration/test_admission.py::test_a_database_outage_lets_requests_through
      - tests/integration/test_admission.py::test_an_unreachable_database_costs_one_request_half_a_second_at_most
    seen_live: null

  - id: data.down
    layer: data
    what: The database refuses connections, times out, or has no free connection in the pool.
    cause: none
    handling: 503 with Retry-After 5, with CORS and the security headers; logged at ERROR.
    person_sees: Holos is busy right now. Please try again in a few seconds.
    code: server_busy
    tests:
      - tests/integration/test_database_down.py::test_a_database_that_refuses_connections
