# Holos item catalogue (Plan C.14).
#
# Exercises and practices: the model may only return these IDs.
# Conditions: profile text resolves to these IDs through the aliases.
# Ingredients: aliases map foods to allergen and diet-conflict tags.
#
# Tags (vocabulary in guardrails/types.py). A missing tag means "low" for
# levels and false for flags. Every name and alias must be unique across
# the whole file, compared after normalise_text().
#
# Lactose: only dairy with meaningful lactose carries it. Ghee, butter and
# hard cheese don't, because most lactose-intolerant people eat them.

# 2: hing contains gluten; common spices, blends and basics added
# 3: "tree nuts" as its own ingredient (tree_nut only); batata for potato
version: 3

