      - better off dead
      - don't want to live
      - dont want to live
      - no reason to live
      - not worth living
      - suicide
      - suicidal
      - self harm
      - self-harm
      - selfharm
      - hurt myself
      - hurting myself
      - cut myself
      - cutting myself
      - overdose
      - hang myself
      - can't go on
      - cant go on
    hi_latn:
      - khudkushi
      - khudkhushi
      - aatmahatya
      - atmahatya
      - marna chahta
      - marna chahti
      - mar jana chahta
      - mar jana chahti
      - mar jaana chahta
      - mar jaana chahti
      - jeena nahi chahta
      - jeena nahi chahti
      - jina nahi chahta
      - jina nahi chahti
      - zindagi khatam
      - apni jaan le
