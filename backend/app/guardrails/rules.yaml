  normalise:
    # Anywhere in the message
    leet: {"0": o, "1": i, "3": e, "@": a, "$": s}
    # Only between two letters: "d!e" and "w4nt", but "die!" stays "die!"
    leet_inner: {"!": i, "|": i, "4": a, "5": s, "7": t}
    # Apostrophes dropped ("don't" = "dont"), hyphens and underscores as spaces,
    # Devanagari: chandrabindu as anusvara (हूँ = हूं), nukta dropped (ज़िंदगी = जिंदगी)
    chars: {"'": "", "\u2019": "", "\u2018": "", "\u02BC": "", "`": "", "-": " ", "_": " ", "\u0901": "\u0902", "\u093C": ""}
